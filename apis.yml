name: CaptivateIQ
description: >-
  CaptivateIQ is a sales performance and commission management platform that automates
  the calculation, administration, and reporting of sales commissions and incentive
  compensation. Its ICM (Incentive Compensation Management) and SPM (Sales Performance
  Management) products let revenue, finance, and sales-ops teams design complex
  commission plans, model quotas and territories, and pay reps accurately and on time.
  CaptivateIQ exposes a public REST API (ciq/v1) for managing employees, users,
  hierarchies, data workbooks and worksheets, employee assumptions, commission plans,
  period groups, payouts, report models, transformation worksheets, uploads, dashboards,
  and audit logs. The API uses token-based authentication (Authorization header with a
  "Token" prefix), limit/offset pagination, and per-tier rate limiting, and is documented
  on a public developer portal with guides, recipes, a changelog, and an llms.txt index.
  CaptivateIQ also serves a live remote MCP endpoint on its developer-docs host and an RFC 8414
  OAuth authorization-server metadata document on its app host, and publicly announced a
  customer-facing CaptivateIQ MCP Server (limited beta, May 2026) for connecting live
  compensation and planning data to AI tools.
