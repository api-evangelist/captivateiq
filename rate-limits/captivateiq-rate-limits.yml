note: >-
  CaptivateIQ publishes two rate-limiting tiers. Exceeding a tier returns HTTP 429.
  A 502 is returned separately when a request exceeds the 30-second infrastructure timeout.
tiers:
- name: Standard
  burst: 5 requests per second
  sustained: 1500 requests per hour
  limit_count: 1500
  window: hour
- name: Enterprise
  burst: 15 requests per second
  sustained: 6000 requests per hour
  limit_count: 6000
  window: hour
exceeded_status: 429
timeout_status: 502
timeout_seconds: 30
