  openapi/captivateiq-openapi-original.yml
note: >-
  CaptivateIQ serves a live remote MCP endpoint on its own developer-docs host at
  https://developers.captivateiq.com/mcp. A GET returns HTTP 200 with the body
  "This URL can only be accessed with a MCP client"; a JSON-RPC POST of
  initialize/tools/list returns HTTP 401 {"code":-32001,"message":"Authorization required"}
  with no WWW-Authenticate challenge and no OAuth discovery documents
  (/.well-known/oauth-protected-resource and /.well-known/oauth-authorization-server both 404).
  The live tool inventory is therefore AUTH-GATED and was NOT observed. Separately,
  CaptivateIQ publicly announced a product-level "CaptivateIQ MCP Server" on 2026-05-14
  for connecting live compensation and planning data to customer AI tools — announced as
  limited beta for select enterprise customers with GA planned later in 2026; no public
  endpoint for that server is documented. The tools[] list below is NOT the live inventory:
  it is a DERIVED candidate mapping (one tool per OpenAPI operation) over the ciq/v1 REST API,
  retained from the previous pass and clearly marked as such.
